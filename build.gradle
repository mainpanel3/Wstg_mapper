plugins {
    id 'java'
}

group = 'dev.wstgmapper'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Burp itself at runtime - compileOnly so it is NOT bundled
    // into the extension jar (that would bloat it and can conflict with the
    // copy Burp already has loaded).
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
}

jar {
    archiveBaseName = 'wstg-mapper'
    archiveVersion = ''
    manifest {
        attributes(
                'Implementation-Title': 'WSTG Mapper',
                'Implementation-Version': project.version
        )
    }
}
